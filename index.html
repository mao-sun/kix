<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>KIX大阪关西空港免税店香烟目录</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f6f4ef; --surface:#fffdf9; --surface2:#efece4;
    --ink:#1d1a16; --ink2:#5d574c; --ink3:#8a8272;
    --line:#ddd6c7; --accent:#b3271e; --accent-ink:#ffffff;
    --chip:#efece4; --chip-on:#1d1a16; --chip-on-ink:#f6f4ef;
    --price:#b3271e; --shadow:0 10px 30px rgba(29,26,22,.14);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16140f; --surface:#201d17; --surface2:#2a271e;
      --ink:#f0ead9; --ink2:#b6ae9c; --ink3:#877f6d;
      --line:#3a362a; --accent:#e0503f; --accent-ink:#fff;
      --chip:#2a271e; --chip-on:#f0ead9; --chip-on-ink:#16140f;
      --price:#ff7a68; --shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.5}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}
  img{display:block}

  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 84px}

  header.top{padding:8px 0 4px}
  h1{font-family:"Songti SC","STSong",serif;font-size:clamp(26px,5vw,38px);margin:0 0 6px;letter-spacing:.02em}

  .ratebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 4px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .ratebar label{font-weight:600}
  .ratebar .formula{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ratebar input[type=number]{width:96px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .rate-example{margin-left:auto;color:var(--ink2);font-size:13px}
  .rate-example b{color:var(--price)}

  .toolbar{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--bg);
    border-bottom:1px solid var(--line)}
  .toolbar-in{max-width:1180px;margin:0 auto;padding:12px 16px 10px}
  .toolbar-spacer{height:0}
  .row1{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
  /* 下滑时只收起搜索框；品牌、排序、分类标签行始终保留 */
  .search{flex:1 1 100%;display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:9px 14px;
    max-height:64px;overflow:hidden;
    transition:max-height .25s ease,opacity .2s ease,padding .25s ease,border-width .25s ease,flex-basis .25s ease}
  .toolbar.sh .search{max-height:0;opacity:0;padding-top:0;padding-bottom:0;padding-left:0;padding-right:0;
    border-width:0;flex-basis:0;pointer-events:none}
  @media (min-width:760px){.search{flex:1 1 240px}}
  .search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
  .search svg{flex:none;color:var(--ink3)}
  select{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);flex:1 1 0;min-width:0}
  @media (min-width:760px){select{flex:0 1 auto;max-width:240px}}
  .clearbtn{flex:none;border:1px solid var(--accent);color:var(--accent);background:transparent;
    border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600}
  .clearbtn[hidden]{display:none}
  .clearbtn:active{transform:scale(.97)}
  .chips{display:flex;flex-wrap:nowrap;gap:6px;margin-top:10px}
  .chip{flex:1 1 0;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    border-radius:999px;padding:6px 4px;font-size:13px;white-space:nowrap;text-align:center}
  .chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:12px}
  @media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:auto 320px}
  .thumb{position:relative;aspect-ratio:1/1;background:#fff}
  .thumb img{width:100%;height:100%;object-fit:contain;padding:10px}
  .badge{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-ink);
    font-size:11px;padding:2px 8px;border-radius:999px;letter-spacing:.03em}
  .cattag{position:absolute;top:8px;right:8px;background:var(--surface2);color:var(--ink2);
    font-size:11px;padding:2px 8px;border-radius:999px;letter-spacing:.03em}
  .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
  .brand{font-size:12px;color:var(--ink3);letter-spacing:.02em;line-height:1.45;word-break:break-word}
  .brand b{color:var(--ink2);font-weight:600}
  .name{font-weight:600;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
  .promo{font-size:11.5px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prices{margin-top:auto;padding-top:6px}
  .jpy{font-size:18px;font-weight:700;color:var(--price);font-variant-numeric:tabular-nums}
  .cny{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .actions{margin-top:9px}
  .addbtn{width:100%;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:9px 0;font-weight:600}
  .addbtn:active{transform:scale(.98)}
  .stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .stepper button{width:40px;height:38px;border:0;background:var(--surface2);font-size:18px;line-height:1}
  .stepper .qty{font-weight:700;font-variant-numeric:tabular-nums}
  .stepper .lbl{font-size:11px;color:var(--ink3)}

  .empty{padding:56px 16px;text-align:center;color:var(--ink2)}
  .sentinel{height:8px}
  .loadmsg{text-align:center;color:var(--ink3);padding:14px;font-size:13px}

  /* cart floating button */
  .cartfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
    display:flex;align-items:center;gap:8px;background:var(--chip-on);color:var(--chip-on-ink);
    border:0;border-radius:999px;padding:13px 18px;font-weight:700;font-size:15px;
    box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
  .cartfab:active{transform:scale(.97)}
  .cartfab svg{flex:none}
  .cartfab .cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;font-weight:700}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(10,8,5,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:51;background:var(--surface);
    transform:translateX(102%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .drawer.on{transform:none;visibility:visible;transition:transform .25s ease}
  .drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
  .drawer header h2{margin:0;font-size:18px}
  .drawer header button{background:none;border:0;font-size:22px;color:var(--ink2);padding:4px 8px}
  .cartlist{flex:1;overflow-y:auto;padding:8px 16px}
  .citem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
  .citem img{width:52px;height:52px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px;flex:none}
  .citem .info{flex:1;min-width:0}
  .citem .nm{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .citem .pr{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .citem .stepper button{width:32px;height:32px;font-size:16px}
  .citem .stepper{min-width:104px}
  .cartempty{padding:48px 8px;text-align:center;color:var(--ink2)}
  .drawer footer{border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .sumrow{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;margin-bottom:4px}
  .sumrow.big{font-size:18px;font-weight:700}
  .sumrow .cnyv{color:var(--ink2);font-size:13.5px;font-weight:400}
  .note{font-size:12px;color:var(--ink3);margin:8px 0 12px}
  .footbtns{display:flex;gap:8px}
  .footbtns button{flex:1;border-radius:9px;padding:11px 0;font-weight:600}
  .btn-copy{background:var(--accent);color:var(--accent-ink);border:0}
  .btn-clear{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:60;
    background:var(--chip-on);color:var(--chip-on-ink);padding:9px 18px;border-radius:999px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.25s}
  .toast.on{opacity:1;transform:translateX(-50%)}
  footer.page{margin-top:36px;color:var(--ink3);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
  footer.page a{color:var(--accent)}
  .err{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:20px;margin-top:20px}

  /* ---- mobile ---- */
  @media (max-width:640px){
    .wrap{padding:14px 12px 84px}
    h1{font-size:23px;line-height:1.3}
    .ratebar{padding:10px 12px;gap:8px;margin-top:12px}
    .ratebar input[type=number]{width:84px;font-size:16px}
    .rate-example{margin-left:0}
    .toolbar-in{padding:10px 12px 8px}
    .row1{gap:7px}
    .search{padding:10px 13px}
    .search input{font-size:16px}
    select{min-height:42px;padding:9px 10px;font-size:14px}
    .clearbtn{min-height:42px}
    .chips{gap:5px;margin-top:9px}
    .chip{min-height:38px;padding:7px 2px;display:inline-flex;align-items:center;justify-content:center}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
    .thumb img{padding:8px}
    .body{padding:9px 10px 11px}
    .name{font-size:14px}
    .prices{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 6px}
    .jpy{font-size:17px}
    .addbtn{padding:11px 0}
    .stepper button{width:36px;height:40px}
    .cartfab{right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:13px 16px}
    .drawer{width:100vw}
    .citem .stepper button{width:34px;height:36px}
    .toast{bottom:88px;max-width:calc(100vw - 32px);text-align:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar-spacer" id="toolbarSpacer"></div>
  <header class="top">
    <h1>KIX大阪关西空港免税店香烟目录</h1>
  </header>

  <div class="ratebar">
    <label for="rate">汇率</label>
    <span class="formula">1 日元 = <input type="number" id="rate" value="0.047" step="0.001" min="0" inputmode="decimal" aria-label="1日元兑换人民币汇率" /> 元人民币</span>
    <span class="rate-example" id="rateExample"></span>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="toolbar-in">
      <div class="row1">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          <input type="search" id="q" placeholder="搜索商品名 / 品牌 / 译名，如 万宝路、TEREA、中华" aria-label="搜索商品" />
        </div>
        <select id="brandSel" aria-label="按品牌筛选"><option value="">全部品牌</option></select>
        <select id="sortSel" aria-label="排序">
          <option value="name" selected>默认（字母排序）</option>
          <option value="priceAsc">价格升序</option>
          <option value="priceDesc">价格降序</option>
        </select>
        <button type="button" class="clearbtn" id="clearFilters" hidden>清除筛选</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="按分类筛选"></div>
    </div>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>没有符合条件的商品，换个关键词或分类试试。</div>
    <div class="sentinel" id="sentinel"></div>
    <p class="loadmsg" id="loadmsg"></p>
    <div class="err" id="err" hidden>商品数据加载失败，请刷新页面重试。</div>
  </main>

  <footer class="page">
    <p>商品图与价格来自 KIX 免税店官网商品页；外国品牌译名为中国市场常见译名，无国内官方译名的保留原文。免税商品的购买资格、数量限制与入境规定请以航司、海关及免税店现场说明为准。</p>
  </footer>
</div>

<button class="cartfab" id="openCart" aria-label="打开购物车">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.6"/><circle cx="19" cy="21" r="1.6"/><path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21.5 7H6"/></svg>
  <span id="fabJpy">¥0</span>
  <span class="cnt" id="fabCnt" hidden>0</span>
</button>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="购物车" inert>
  <header>
    <h2>购物车</h2>
    <button id="closeCart" aria-label="关闭购物车">✕</button>
  </header>
  <div class="cartlist" id="cartlist"></div>
  <footer>
    <div class="sumrow big"><span>合计（日元）</span><span id="sumJpy">¥0</span></div>
    <div class="sumrow"><span>折合人民币</span><span class="cnyv" id="sumCny">¥0</span></div>
    <div class="sumrow"><span>件数</span><span id="sumCnt">0 件</span></div>
    <p class="note">提示：中国内地入境免税额度一般为香烟 400 支，免税店一条通常为 200 支（10 包），超量部分入境时需申报纳税，请按同行人数核对。</p>
    <div class="footbtns">
      <button class="btn-clear" id="clearCart">清空</button>
      <button class="btn-copy" id="copyCart">复制购物清单</button>
    </div>
  </footer>
</aside>
<div class="toast" id="toast"></div>

<script>
(function(){
  var CATS = [
    { v:'日本产香烟', t:'日本' },
    { v:'中国产香烟', t:'中国' },
    { v:'外国产香烟', t:'国外' },
    { v:'加热烟', t:'加热' },
    { v:'口含烟', t:'口含' },
    { v:'雪茄及其他烟制品', t:'雪茄及其他' }
  ];
  function catLabel(v){ for (var i=0;i<CATS.length;i++) if (CATS[i].v===v) return CATS[i].t; return v; }
  var PAGE = 60;
  var products = [], filtered = [], shown = 0;
  var state = { cat:'全部', q:'', brand:'', sort:'name' };
  var cart = {}; // id -> qty （仅本次打开期间有效）
  var rate = 0.047;

  var $ = function(id){ return document.getElementById(id); };
  var grid=$('grid'), chipsEl=$('chips'), emptyEl=$('empty'),
      loadmsg=$('loadmsg'), toastEl=$('toast');

  function fmtJPY(n){ return '¥' + n.toLocaleString('ja-JP'); }
  function fmtCNY(jpy){
    var v = jpy * rate;
    return (v >= 1000 ? Math.round(v).toLocaleString('zh-CN') : (Math.round(v*10)/10).toLocaleString('zh-CN')) + ' 元';
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  /* brand_cn 已包含 brand（如「百乐门 (Parliament)」含「百乐门」、「切 (CHE)」含「CHE」）时，品牌只显示一次 */
  function brandDup(p){ return !!p.brand && p.brand_cn.toLowerCase().indexOf(p.brand.toLowerCase()) !== -1; }
  function brandLineHTML(p){
    return brandDup(p)
      ? '<b>'+esc(p.brand_cn)+'</b>'
      : '<b>'+esc(p.brand_cn)+'</b> · '+esc(p.brand);
  }
  /* 商品名里不再重复品牌（品牌行已单独显示）：剥掉开头的品牌前缀（中英文、繁体写法、
     品牌后紧跟括号说明的情况都能识别），并去掉结尾的设备适配说明（如「for glo hyper」
     「(仅适用于 IQOS ILUMA)」）；原始数据不动 */
  var TRAD = {'衛':'卫','龍':'龙','鳳':'凤','門':'门','紅':'红','雙':'双','樂':'乐','爾':'尔','鶴':'鹤','黃':'黄','樓':'楼','國':'国','煙':'烟','臺':'台','灣':'湾','氣':'气','貓':'猫','麼':'么'};
  function norm(s){ return String(s).split('').map(function(ch){ return TRAD[ch] || ch; }).join(''); }
  function displayName(p){
    var name = p.name;
    var cands = [];
    function addCand(c){ c = (c || '').trim(); if (c && cands.indexOf(c) === -1) cands.push(c); }
    addCand(p.brand);
    addCand(p.brand_cn.split(/[（(]/)[0]);
    addCand(p.brand_cn);
    var m = p.brand_cn.match(/[（(]([^）)]*)[）)]/);
    if (m){ addCand(m[1].split(/[，,]/)[0]); addCand(m[1]); }
    var byLen = cands.slice().sort(function(a,b){ return b.length - a.length; });
    /* 剥完后剩下的部分要还能认：至少 2 个字符，或 1 个汉字（如 芙蓉王「硬」） */
    function usableRest(rest){
      if (rest.length >= 2) return true;
      if (rest.length === 1 && /[^\x00-\xff]/.test(rest)) return true;
      return false;
    }
    /* 1) 结尾的适配说明：括号内含品牌名 / 「for 品牌…」/ 结尾孤立的品牌词 */
    var guard = 0, changed = true;
    while (changed && guard++ < 3){
      changed = false;
      var nn = norm(name).toLowerCase();
      var pm = name.match(/\s*[\(（]([^()（）]*)[\)）]\s*$/);
      if (pm){
        var inner = norm(pm[1]).toLowerCase(), hit = false;
        for (var i = 0; i < cands.length; i++){
          if (cands[i].length >= 2 && inner.indexOf(norm(cands[i]).toLowerCase()) !== -1){ hit = true; break; }
        }
        if (hit){
          var cut = name.slice(0, name.length - pm[0].length).replace(/[\s·・\-—–]+$/, '');
          if (cut.length >= 2){ name = cut; changed = true; continue; }
        }
      }
      var re = /\sfor\s+/g, mm, lastFor = -1;
      while ((mm = re.exec(nn)) !== null){
        var after = nn.slice(mm.index + mm[0].length);
        for (var j = 0; j < cands.length; j++){
          var cb = norm(cands[j]).toLowerCase();
          if (cb.length >= 2 && after.indexOf(cb) === 0) lastFor = mm.index;
        }
      }
      if (lastFor > 0){
        var cut2 = name.slice(0, lastFor).replace(/[\s·・\-—–]+$/, '');
        if (cut2.length >= 2){ name = cut2; changed = true; continue; }
      }
      for (var k = 0; k < byLen.length; k++){
        var cb2 = norm(byLen[k]).toLowerCase();
        if (cb2.length >= 2 && nn.length > cb2.length + 1 && nn.slice(-cb2.length) === cb2 && nn.charAt(nn.length - cb2.length - 1) === ' '){
          var cut3 = name.slice(0, name.length - byLen[k].length).replace(/[\s·・\-—–]+$/, '');
          if (cut3.length >= 4){ name = cut3; changed = true; }
          break;
        }
      }
    }
    /* 2) 开头的品牌前缀，可重复剥（中文名后可能再跟英文名） */
    for (var pass = 0; pass < 3; pass++){
      var nName = norm(name).toLowerCase(), hitC = null;
      for (var i2 = 0; i2 < byLen.length; i2++){
        var c = byLen[i2];
        if (c.length >= 2 && name.length > c.length && nName.indexOf(norm(c).toLowerCase()) === 0){ hitC = c; break; }
      }
      if (!hitC) break;
      /* 英文品牌后紧跟数字是连写型号（如 with2），不是品牌重复 */
      if (/^[A-Za-z][A-Za-z ]*$/.test(hitC) && /[0-9]/.test(name.charAt(hitC.length))) break;
      var rest = name.slice(hitC.length).replace(/^[\s·・\-—–]+/, '');
      if (rest.charAt(0) === '(' || rest.charAt(0) === '（'){
        /* 品牌后紧跟括号说明：拆掉括号，保留里面的内容 */
        var close = -1;
        for (var t = 1; t < rest.length; t++){ if (rest[t] === ')' || rest[t] === '）'){ close = t; break; } }
        if (close > 0){
          var innerT = rest.slice(1, close);
          var afterT = rest.slice(close + 1).replace(/^[\s·・\-—–]+/, '');
          var joined = (/[A-Za-z0-9]$/.test(innerT) && /^[A-Za-z0-9]/.test(afterT)) ? innerT + ' ' + afterT : innerT + afterT;
          if (usableRest(joined)){ name = joined; continue; }
        }
        break;
      }
      if (usableRest(rest)){ name = rest; continue; }
      break;
    }
    return name;
  }

  /* ---------- filters ---------- */
  function applyFilters(){
    var q = state.q.trim().toLowerCase();
    filtered = products.filter(function(p){
      if (state.cat !== '全部' && p.cat !== state.cat) return false;
      if (state.brand && p.brand !== state.brand) return false;
      if (q){
        var hay = (p.name + ' ' + p.brand + ' ' + p.brand_cn + ' ' + p.cat + ' ' + catLabel(p.cat)).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    if (state.sort === 'priceAsc') filtered.sort(function(a,b){ return a.price-b.price || (a.id<b.id?-1:1); });
    else if (state.sort === 'priceDesc') filtered.sort(function(a,b){ return b.price-a.price || (a.id<b.id?-1:1); });
    else filtered.sort(function(a,b){ var c = a.name.localeCompare(b.name,'zh'); return c!==0 ? c : (a.id<b.id?-1:1); });

      + '<div class="thumb"><img loading="lazy" decoding="async" src="assets/imgs/'+p.id+'.jpg" alt="'+esc(p.brand_cn+' '+displayName(p))+'" width="266" height="266" />'
      + (p.badge ? '<span class="badge">'+esc(p.badge)+'</span>' : '')
      + '<span class="cattag">'+esc(catLabel(p.cat))+'</span></div>'

  function renderMore(){
    var next = filtered.slice(shown, shown + PAGE);
    if (next.length){
      var html = '';
      for (var i=0;i<next.length;i++) html += cardHTML(next[i]);
      grid.insertAdjacentHTML('beforeend', html);
      shown += next.length;
    }
    loadmsg.textContent = shown < filtered.length ? '继续下滑加载更多 · 已显示 ' + shown + ' / ' + filtered.length : (filtered.length ? '已显示全部 ' + filtered.length + ' 件' : '');
  }

  var io = new IntersectionObserver(function(es){
    if (es[0].isIntersecting && shown < filtered.length) renderMore();

  /* refresh only prices (rate change) without rebuilding DOM structure */
  function refreshPrices(){

    for (var i=0;i<priceEls.length && i<shown;i++){
      var p = filtered[i]; if (!p) break;
      var cny = priceEls[i].querySelector('.cny');

  /* ---------- cart ---------- */
  function cartTotals(){
    var jpy=0, cnt=0;

    return { jpy:jpy, cnt:cnt };
  }
  function setQty(id, qty){
    if (qty <= 0) delete cart[id]; else cart[id] = qty;
    // sync card action area if visible
    var box = grid.querySelector('[data-actions="'+id+'"]');
    if (box){
      var p = byId(id), q2 = cart[id]||0;
      box.innerHTML = q2===0
        ? '<button class="addbtn" data-act="add" data-id="'+id+'">加入购物车</button>'
        : '<div class="stepper"><button data-act="dec" data-id="'+id+'" aria-label="减少">−</button><span><span class="qty">'+q2+'</span> <span class="lbl">件在购物车</span></span><button data-act="inc" data-id="'+id+'" aria-label="增加">＋</button></div>';
    }

  function renderCart(){

    $('sumJpy').textContent = fmtJPY(t.jpy);

    var ids = Object.keys(cart);
